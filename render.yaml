services:
  - type: web
    name: codveda-backend
    env: node
    repo: https://github.com/MohamedAmineGharsalli/codveda-internship.git
    branch: main
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run dev
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false 